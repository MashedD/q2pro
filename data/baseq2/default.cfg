// Default settings for this Q2PRO package.
//
// Executed at startup before your q2config.cfg, so everything you change in
// the game overrides it. It replaces the default.cfg from pak0.pak.

unbindall

// Movement
bind w          +forward
bind s          +back
bind a          +moveleft
bind d          +moveright
bind SPACE      +moveup
bind MOUSE2     +moveup
bind MOUSE3     +forward
bind CTRL       +movedown
bind c          +movedown
bind SHIFT      +speed
bind UPARROW    +forward
bind DOWNARROW  +back
bind LEFTARROW  +left
bind RIGHTARROW +right
bind ,          +moveleft
bind .          +moveright
bind ALT        +strafe

// Looking
bind PGDN       +lookup
bind DEL        +lookdown
bind z          +lookdown
bind END        centerview
bind \          +mlook
bind INS        +klook

// Weapons
bind MOUSE1     +attack
bind MWHEELUP   weapnext
bind MWHEELDOWN weapprev
bind /          weapnext
bind 1          "use Blaster"
bind 2          "use Shotgun"
bind 3          "use Super Shotgun"
bind 4          "use Machinegun"
bind 5          "use Chaingun"
bind 6          "use Grenade Launcher"
bind 7          "use Rocket Launcher"
bind 8          "use HyperBlaster"
bind 9          "use Railgun"
bind 0          "use BFG10K"
bind g          "use grenades"

// Inventory and items
bind F1         inven
bind ENTER      invuse
bind [          invprev
bind ]          invnext
bind '          invdrop
bind BACKSPACE  invdrop
bind q          "use quad damage"
bind f          "use silencer"
bind b          "use rebreather"
bind e          "use environment suit"
bind i          "use invulnerability"
bind p          "use power shield"

// Gestures
bind h          "wave 0"
bind j          "wave 1"
bind k          "wave 2"
bind l          "wave 3"
bind u          "wave 4"

// Chat and interface
bind t          messagemode
bind ESCAPE     togglemenu
bind `          toggleconsole
bind ~          toggleconsole
bind PAUSE      pause
bind =          sizeup
bind +          sizeup
bind -          sizedown
bind TAB        "cmd help"
bind F2         "pushmenu savegame"
bind F3         "pushmenu loadgame"
bind F4         "pushmenu keys"
bind F5         "pushmenu startserver"
bind F6         "echo Quick saving...; wait; save quick"
bind F9         "echo Quick loading...; wait; load quick"
bind F10        quit
bind F12        screenshot

// Settings
set crosshair   1
set cl_run      1
set name        Player

// Vertical sync adds noticeable input lag, so it starts off. It can be turned
// on in the video menu.
seta gl_swapinterval "0"

// With bloom on, let lamps without glow maps glow too.
seta gl_bloom_lamps "2"

// Limit the client to 120 frames per second. Frame times are whole
// milliseconds, so this becomes 125 (8 ms); don't warn about the rounding.
set cl_maxfps   120
set cl_warn_on_fps_rounding 0

// Used by the single player menu and by dedicated servers started without a
// map.
alias newgame "killserver; maxclients 1; deathmatch 0; map *ntro.cin+base1"
alias dedicated_start "map base1"

// Attract mode demos.
alias d1 "demomap idlog.cin; set nextserver d2"
alias d2 "demomap demo1.dm2; set nextserver d3"
alias d3 "demomap idlog.cin; set nextserver d4"
alias d4 "demomap demo2.dm2; set nextserver d1"
