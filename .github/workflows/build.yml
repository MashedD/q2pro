name: build

on:
  push:
    branches: [master, ci]
  pull_request:
    branches: [master]

env:
  MESON_ARGS: >-
    --auto-features=enabled
    --fatal-meson-warnings
    -Danticheat-server=true
    -Davcodec=disabled
    -Dclient-gtv=true
    -Dpacketdup-hack=true
    -Dtests=true
    -Dvariable-fps=true
    -Dwerror=true

  MESON_ARGS_WIN: >-
    -Dsdl2=disabled
    -Dwayland=disabled
    -Dwrap_mode=forcefallback
    -Dx11=disabled

  MESON_ARGS_LINUX: >-
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback

  MESON_ARGS_MACOS: >-
    -Dbuildtype=release
    -Dicmp-errors=disabled
    -Dpkg_config_path=/opt/homebrew/opt/openal-soft/lib/pkgconfig
    -Dwayland=disabled
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback
    -Dx11=disabled

  MESON_ARGS_FREEBSD: >-
    -Dbuildtype=release
    -Dc_std=c23
    -Dicmp-errors=disabled
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback

# A new push to a pull request replaces its older, unfinished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck .ci/package-*.sh .ci/build-openal-windows.sh

  mingw:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: ["i686", "x86_64"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y gcc-mingw-w64 nasm meson ninja-build

      - name: Build
        run: |
          meson setup --cross-file=.ci/${{ matrix.arch }}-w64-mingw32.txt \
          ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} builddir
          meson compile -C builddir

      - uses: actions/upload-artifact@v7
        with:
          name: q2pro-mingw-${{ matrix.arch }}
          path: |
            builddir/q2pro.exe
            builddir/q2proded.exe
            builddir/*.dll
          if-no-files-found: error
          retention-days: 30

  msvc:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: ["x86", "x64"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - uses: ilammy/setup-nasm@v1

      - name: Install dependencies
        run: pip3 install --no-input meson ninja

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} builddir
          meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        cc: [gcc, clang]
        buildtype: [debugoptimized]
        include:
          - cc: gcc
            buildtype: release
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y meson libsdl2-dev libopenal-dev \
          libpng-dev libjpeg-dev zlib1g-dev mesa-common-dev \
          libcurl4-gnutls-dev libx11-dev libxi-dev \
          libwayland-dev wayland-protocols libdecor-0-dev

      - name: Build
        run: |
          meson setup --buildtype=${{ matrix.buildtype }} \
          ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_LINUX }} builddir
          meson compile -C builddir
        env:
          CC: ${{ matrix.cc }}

      - name: Test
        run: meson test -C builddir --print-errorlogs

      # Artifacts are stored as zip files, which drop Unix permissions, so
      # pack the binaries in a tarball to keep them executable.
      - name: Pack binaries
        run: tar -czf q2pro-linux.tar.gz -C builddir q2pro q2proded $(cd builddir && ls *.so)

      - uses: actions/upload-artifact@v7
        with:
          name: q2pro-linux-${{ matrix.cc }}-${{ matrix.buildtype }}
          path: q2pro-linux.tar.gz
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew update
          brew install meson sdl2 openal-soft libpng jpeg-turbo

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_MACOS }} builddir
          meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: cross-platform-actions/action@v1.7.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '15.1'
          run: |
            sudo pkg update
            sudo pkg install -y git meson pkgconf openal-soft \
            sdl2 curl png jpeg-turbo libX11 libdecor evdev-proto wayland-protocols
            meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_FREEBSD }} builddir
            meson compile -C builddir
            meson test -C builddir --print-errorlogs
